server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;

    # Docker's DNS; re-resolving keeps the proxy working after the backend container is recreated.
    resolver 127.0.0.11 valid=10s;
    # A stopped backend's name takes Docker DNS ~3 s to reject; fail in 1 s so the outage shows quickly.
    resolver_timeout 1s;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # STOMP over WebSocket (real-time push). The backend checks that the Origin matches the Host, so pass the Host
    # with its port. Broker heartbeats (10 s) keep the socket inside nginx's 60 s idle timeout.
    location = /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed bundle files never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes (/dashboard, /events, unknown paths) all load the SPA.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
