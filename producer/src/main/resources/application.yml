spring:
  application:
    name: producer
  kafka:
    bootstrap-servers: localhost:9092
    template:
      # Puts the W3C traceparent header on each record, so the backend's consumer span joins this trace.
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      # Fail fast when Kafka is down instead of blocking callers for the 60s+ client defaults.
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        # The seed burst hits a just-created topic; with several batches in flight, a rejected first batch
        # (leader not ready) left sequence gaps and lost events. One in-flight request keeps retries in order.
        max.in.flight.requests.per.connection: 1
  mvc:
    problemdetails:
      enabled: true

producer:
  interval-ms: ${PRODUCER_INTERVAL_MS:2000}
  duplicate-ratio: ${PRODUCER_DUPLICATE_RATIO:0.05}
  # Share of intentionally broken messages, to demo the backend's dead-letter topic.
  invalid-ratio: ${PRODUCER_INVALID_RATIO:0.02}
  seed-count: ${PRODUCER_SEED_COUNT:200}
  topic:
    name: incident-events
    partitions: 3
    retention: 24h

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      # Every request and event is traced (Boot samples 10% by default); demo volume is small.
      probability: 1.0
  otlp:
    tracing:
      # OTLP/HTTP to Jaeger; the compose service overrides the host with MANAGEMENT_OTLP_TRACING_ENDPOINT.
      endpoint: http://localhost:${JAEGER_OTLP_PORT:4318}/v1/traces
