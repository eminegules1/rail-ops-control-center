spring:
  application:
    name: backend
  datasource:
    # Host-run defaults match the compose demo defaults; the compose service sets SPRING_DATASOURCE_*.
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:incidents}
    username: ${POSTGRES_USER:rail_ops}
    password: ${POSTGRES_PASSWORD:rail_ops_local_only}
    hikari:
      # Fail fast (ms) while Postgres is down (default 30000): the listener retries sooner after it returns,
      # and /actuator/health answers within the compose healthcheck timeout.
      connection-timeout: 5000
  data:
    redis:
      # Host-run default; the compose service sets SPRING_DATA_REDIS_HOST.
      host: localhost
      port: ${REDIS_PORT:6379}
      # Fail fast while Redis is down (Lettuce default 60s), like the Hikari timeout above. Short enough that the
      # "redis" circuit breaker's sliding window fills, and each half-open probe fails, within about a second.
      timeout: 500ms
  jackson:
    deserialization:
      # {"status":1} is a 400, not ACKNOWLEDGED by enum position.
      fail-on-numbers-for-enums: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: incident-processor
      # Events published before the backend first starts (the seed burst) are still consumed.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Undeserializable records reach the error handler as a non-retryable DeserializationException
      # instead of failing every poll.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.railops.backend.IncidentEventDeserializer
    listener:
      concurrency: 3
      # Offsets are committed only after the event is stored; MANUAL_IMMEDIATE also lets the error
      # handler commit the offsets of records it sent to the dead-letter topic.
      ack-mode: manual_immediate

ingestion:
  topic:
    name: incident-events
    partitions: 3
    retention: 24h
  dead-letter:
    name: incident-events.DLT
    retention: 7d
  # 1s, 2s, 4s, 8s, 16s, then 30s: about 2 minutes of retries before a record goes to the dead-letter topic.
  retry:
    initial-interval: 1s
    multiplier: 2.0
    max-interval: 30s
    max-retries: 8

auth:
  # Local demo accounts only, like the database password above.
  admin-password: RailOps#Admin2026
  viewer-password: RailOps#Viewer2026
  # HS256 key for login tokens, at least 32 bytes. No default is committed: blank means a random key per start,
  # so sessions end when the backend restarts. Set AUTH_JWT_SECRET to keep them.
  jwt-secret: ${AUTH_JWT_SECRET:}

resilience4j:
  circuitbreaker:
    instances:
      redis:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.dao.DataAccessException

logging:
  level:
    # Hibernate logs the whole failing row (event values) when Postgres rejects an insert; the Kafka error
    # handler already logs skips and retries with the SQL state only.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: off

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
